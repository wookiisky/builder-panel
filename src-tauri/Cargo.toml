[package]
name = "builder-panel"
version = "0.1.0"
description = "A local-first floating panel for coding agent sessions."
authors = ["Builder Panel Contributors"]
edition = "2021"
default-run = "builder-panel"

[lib]
name = "builder_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "builder-panel"
path = "src/main.rs"

[[bin]]
name = "builder-panel-hook"
path = "src/bin/builder-panel-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml_edit = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes"
] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSURL"] }
objc2-app-kit = { version = "0.2", features = [
  "NSWorkspace",
  "NSRunningApplication",
  "NSPasteboard",
] }
