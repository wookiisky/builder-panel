[package]
name = "builder-panel"
version = "0.1.0"
description = "A local-first floating panel for coding agent sessions."
authors = ["Builder Panel Contributors"]
edition = "2021"
default-run = "builder-panel"

[lib]
name = "builder_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "builder-panel"
path = "src/main.rs"

[[bin]]
name = "builder-panel-hook"
path = "src/bin/builder-panel-hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes"
] }
