name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check architecture boundaries
        run: pnpm architecture:check
      - name: Check spec docs
        run: pnpm spec:check
      - name: Check performance budget scenarios
        run: pnpm performance:check
      - name: Lint frontend
        run: pnpm lint
      - name: Test frontend
        run: pnpm test
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
